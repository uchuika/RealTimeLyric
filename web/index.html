<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RealTimeLyric</title>
    </head>
    <body>
        <h1>RealTimeLyric</h1>
        <main>
            <div>
                Open
                <button id="open-button" onclick="onSelectMusic()">Open Music Files</button>
            </div>
            <ul id="musics">
            </ul>
        </main>
        <script>
            async function onSelectMusic() {
                const button = document.getElementById("open-button");
                const list = document.getElementById("musics");
                button.disabled = true;
                list.textContent = "解析中...";

                try {
                    const results = await pywebview.api.selectMusic();
                    updateList(results);
                } catch (error) {
                    list.textContent = "エラーが発生しました: " + error;
                } finally {
                    button.disabled = false;
                }
            }

            function updateList(results) {
                const list = document.getElementById("musics");
                list.replaceChildren();

                for (const result of results) {
                    const item = document.createElement("li");

                    if (!result.recognized) {
                        item.textContent = result.file + " - " + result.message;
                        list.appendChild(item);
                        continue;
                    }

                    if (result.imageUrl) {
                        const image = document.createElement("img");
                        image.src = result.imageUrl;
                        image.alt = result.title + "のカバー画像";
                        image.width = 100;
                        item.appendChild(image);
                    }

                    const description = document.createElement("span");
                    description.textContent =
                        result.title + " / " + result.artist;
                    item.appendChild(description);

                    if (result.shazamUrl) {
                        const link = document.createElement("a");
                        link.href = result.shazamUrl;
                        link.textContent = " Shazamで開く";
                        link.target = "_blank";
                        item.appendChild(link);
                    }

                    list.appendChild(item);
                }
            }
        </script>
    </body>
</html>
