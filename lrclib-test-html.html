<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>LRCLIB API Test</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 720px;
      margin: 40px auto;
      line-height: 1.6;
    }

    input, button {
      font-size: 16px;
      padding: 8px;
      margin: 4px 0;
      width: 100%;
      box-sizing: border-box;
    }

    pre {
      white-space: pre-wrap;
      background: #f4f4f4;
      padding: 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>LRCLIB API Test</h1>

  <label>
    曲名
    <input id="track" value="Tell Your World">
  </label>

  <label>
    アーティスト名
    <input id="artist" value="livetune feat. Hatsune Miku">
  </label>

  <label>
    再生時間（秒・任意）
    <input id="duration" type="number" value="257">
  </label>

  <button id="search">歌詞を取得</button>

  <h2>結果</h2>
  <pre id="result">ここに歌詞が表示されます</pre>

  <script>
    async function fetchLyrics(trackName, artistName, duration) {
      const params = new URLSearchParams({
        track_name: trackName
      });

      if (artistName) {
        params.set("artist_name", artistName);
      }

      if (duration) {
        params.set("duration", duration);
      }

      const url = `https://lrclib.net/api/get?${params.toString()}`;

      const response = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });

      if (response.status === 404) {
        throw new Error("LRCLIBに歌詞が見つかりませんでした");
      }

      if (!response.ok) {
        throw new Error(`LRCLIB APIエラー: HTTP ${response.status}`);
      }

      return await response.json();
    }

    document.getElementById("search").addEventListener("click", async () => {
      const trackName = document.getElementById("track").value.trim();
      const artistName = document.getElementById("artist").value.trim();
      const duration = document.getElementById("duration").value.trim();
      const result = document.getElementById("result");

      if (!trackName) {
        result.textContent = "曲名を入力してください";
        return;
      }

      result.textContent = "取得中...";

      try {
        const data = await fetchLyrics(trackName, artistName, duration);

        const lyrics = data.syncedLyrics || data.plainLyrics || "歌詞本文がありません";

        result.textContent =
          `曲名: ${data.trackName}\n` +
          `アーティスト: ${data.artistName}\n` +
          `アルバム: ${data.albumName || "不明"}\n\n` +
          lyrics;
      } catch (error) {
        result.textContent = error.message;
      }
    });
  </script>
</body>
</html>
